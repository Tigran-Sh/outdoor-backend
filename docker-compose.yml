services:
  postgres:
    image: postgres:16-alpine
    container_name: outdoor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: outdoor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - 5432:5432/tcp
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres", "-d", "outdoor" ]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: outdoor-backend-web:local
    container_name: outdoor-web
    command: scripts/start.sh
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/outdoor
    ports:
      - 8000:8000/tcp
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
    name: outdoor-postgres-data
    driver: local

networks:
  default:
    name: outdoor
    driver: bridge
